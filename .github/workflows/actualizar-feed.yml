name: Sincronizar radar de licitaciones

on:
  workflow_dispatch:
    inputs:
      modo:
        description: Tipo de comprobacion
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - auditoria_anual
  schedule:
    # GitHub interpreta el cron en UTC. En horario de verano peninsular
    # estas horas corresponden a las 09:00, 13:00, 17:00 y 21:00.
    - cron: "0 7,11,15,19 * * *"
    - cron: "30 3 * * 0"

permissions:
  contents: write

concurrency:
  group: sincronizar-radar-licitaciones
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas openpyxl requests

      - name: Determinar tipo de comprobacion
        id: modo
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          CRON_ACTUAL: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$MODO_MANUAL" = "auditoria_anual" ]; then
            echo "argumento=--desde-inicio" >> "$GITHUB_OUTPUT"
            echo "nombre=auditoria histórica desde 2025" >> "$GITHUB_OUTPUT"
          elif [ "$CRON_ACTUAL" = "30 3 * * 0" ]; then
            echo "argumento=--desde-inicio" >> "$GITHUB_OUTPUT"
            echo "nombre=auditoria histórica desde 2025" >> "$GITHUB_OUTPUT"
          else
            echo "argumento=" >> "$GITHUB_OUTPUT"
            echo "nombre=sincronizacion incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Reintentar histórico de licitaciones 2025
        if: steps.modo.outputs.argumento == '--desde-inicio'
        continue-on-error: true
        run: python importar_historico_licitaciones_2025.py

      - name: Ejecutar sincronizacion con reintentos
        shell: bash
        env:
          ARGUMENTO: ${{ steps.modo.outputs.argumento }}
        run: |
          esperas=(0 120 300)
          for indice in "${!esperas[@]}"; do
            espera=${esperas[$indice]}
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
            if python sincronizar_licitaciones.py $ARGUMENTO; then exit 0; fi
          done
          echo "La Plataforma no pudo sincronizarse tras tres intentos." >&2
          exit 1

      - name: Validar integridad de la base
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sqlite3

          with sqlite3.connect("licitaciones.db") as conexion:
              total = conexion.execute("SELECT COUNT(*) FROM licitaciones").fetchone()[0]
              duplicados = conexion.execute(
                  "SELECT COUNT(*) FROM ("
                  "SELECT id FROM licitaciones GROUP BY id HAVING COUNT(*) > 1)"
              ).fetchone()[0]
              integridad = conexion.execute("PRAGMA integrity_check").fetchone()[0]
              cuarentena = conexion.execute(
                  "SELECT COUNT(*) FROM cuarentena_licitaciones"
              ).fetchone()[0]
          metadata = json.loads(open("sync_metadata.json", encoding="utf-8").read())
          resultado = metadata.get("feed_incremental_ultima_ejecucion", {})
          conciliacion = resultado.get("conciliacion", {})
          print({
              "total": total,
              "duplicados": duplicados,
              "integridad": integridad,
              "cuarentena": cuarentena,
              "conciliacion": conciliacion,
              "descartadas_por_motivo": resultado.get("descartadas_por_motivo", {}),
          })
          if (
              total == 0
              or duplicados
              or integridad != "ok"
              or not conciliacion.get("cuadra")
          ):
              raise SystemExit("La base sincronizada no supera la validacion.")
          PY

      - name: Publicar cambios si los hay
        shell: bash
        env:
          RAMA_DESTINO: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- licitaciones.db sync_metadata.json auditoria_licitaciones_2025.json)" ]; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- licitaciones.db sync_metadata.json
          if [ -f auditoria_licitaciones_2025.json ]; then
            git add -- auditoria_licitaciones_2025.json
          fi
          git commit -m "Actualiza radar de licitaciones"
          for intento in 1 2 3; do
            git pull --rebase origin "$RAMA_DESTINO"
            if git push origin "HEAD:$RAMA_DESTINO"; then exit 0; fi
            sleep $((intento * 5))
          done
          echo "No se pudo publicar la base tras tres intentos." >&2
          exit 1
