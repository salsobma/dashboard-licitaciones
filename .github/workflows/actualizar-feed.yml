name: Sincronizar radar de licitaciones

on:
  workflow_dispatch:
    inputs:
      modo:
        description: Tipo de comprobacion
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - auditoria_anual
  schedule:
    - cron: "0 9,13,17,21 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 3 * * 0"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: sincronizar-radar-licitaciones
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas openpyxl requests

      - name: Determinar tipo de comprobacion
        id: modo
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          CRON_ACTUAL: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$MODO_MANUAL" = "auditoria_anual" ]; then
            echo "argumento=--desde-inicio" >> "$GITHUB_OUTPUT"
            echo "nombre=auditoria anual" >> "$GITHUB_OUTPUT"
          elif [ "$CRON_ACTUAL" = "30 3 * * 0" ]; then
            echo "argumento=--desde-inicio" >> "$GITHUB_OUTPUT"
            echo "nombre=auditoria anual" >> "$GITHUB_OUTPUT"
          else
            echo "argumento=" >> "$GITHUB_OUTPUT"
            echo "nombre=sincronizacion incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar sincronizacion con reintentos
        shell: bash
        env:
          ARGUMENTO: ${{ steps.modo.outputs.argumento }}
        run: |
          esperas=(0 120 300)
          for indice in "${!esperas[@]}"; do
            espera=${esperas[$indice]}
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
            if python sincronizar_licitaciones.py $ARGUMENTO; then exit 0; fi
          done
          echo "La Plataforma no pudo sincronizarse tras tres intentos." >&2
          exit 1

      - name: Validar integridad de la base
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3

          with sqlite3.connect("licitaciones.db") as conexion:
              total = conexion.execute("SELECT COUNT(*) FROM licitaciones").fetchone()[0]
              duplicados = conexion.execute(
                  "SELECT COUNT(*) FROM ("
                  "SELECT id FROM licitaciones GROUP BY id HAVING COUNT(*) > 1)"
              ).fetchone()[0]
          print({"total": total, "duplicados": duplicados})
          if total == 0 or duplicados:
              raise SystemExit("La base sincronizada no supera la validacion.")
          PY

      - name: Publicar cambios si los hay
        shell: bash
        env:
          RAMA_DESTINO: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- licitaciones.db sync_metadata.json)" ]; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- licitaciones.db sync_metadata.json
          git commit -m "Actualiza radar de licitaciones"
          for intento in 1 2 3; do
            git pull --rebase origin "$RAMA_DESTINO"
            if git push origin "HEAD:$RAMA_DESTINO"; then exit 0; fi
            sleep $((intento * 5))
          done
          echo "No se pudo publicar la base tras tres intentos." >&2
          exit 1
