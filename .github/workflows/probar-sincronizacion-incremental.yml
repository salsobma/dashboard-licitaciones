name: Probar sincronizacion incremental

on:
  workflow_dispatch:
  push:
    branches:
      - pruebas-sincronizacion-incremental

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas openpyxl

      - name: Sincronizar una copia de prueba
        shell: bash
        run: |
          cp licitaciones.db licitaciones_prueba.db
          cp sync_metadata.json sync_metadata_prueba.json
          python sincronizar_licitaciones.py \
            --db licitaciones_prueba.db \
            --metadata sync_metadata_prueba.json

      - name: Validar integridad
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3

          with sqlite3.connect("licitaciones_prueba.db") as conexion:
              total = conexion.execute("SELECT COUNT(*) FROM licitaciones").fetchone()[0]
              duplicados = conexion.execute(
                  "SELECT COUNT(*) FROM ("
                  "SELECT id FROM licitaciones GROUP BY id HAVING COUNT(*) > 1)"
              ).fetchone()[0]
              fuera_cpv = conexion.execute(
                  "SELECT COUNT(*) FROM licitaciones WHERE cpv IS NULL OR cpv NOT LIKE '%71%'"
              ).fetchone()[0]
          print({"total": total, "duplicados": duplicados, "fuera_cpv": fuera_cpv})
          if total == 0 or duplicados:
              raise SystemExit("La copia sincronizada no supera la validacion.")
          PY
